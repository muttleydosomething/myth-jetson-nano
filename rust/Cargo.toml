[package]
name = "chatterbox-rs"
version = "0.1.0"
edition = "2021"
license = "MIT AND Apache-2.0 AND BSD-2-Clause AND ISC"
description = "Native Chatterbox Turbo token-generation runtime for Capricorn 15"

# This deployable Borg component is independent of the gateway workspace.
[workspace]

[dependencies]
base64 = "=0.13.1"
futures-core = "=0.3.34"
axum = { version = "=0.7.9", default-features = false, features = ["http1", "json", "tokio", "multipart", "query"] }
half = "2"
libloading = "0.8"
libc = "=0.2.191"
matrixmultiply = "=0.3.11"
rustfft = "=6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }

# sha2 0.10 gates AArch64 runtime SHA2 dispatch behind this feature. Keep its
# portable fallback for processors without SHA instructions; never force ISA.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm-aarch64"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
